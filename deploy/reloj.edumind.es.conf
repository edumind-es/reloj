# ============================================================================
# reloj.edumind.es — Reloj EDUmind (PWA estática, local first, sin backend)
#
# Raíz: /var/www/reloj/public (el repo, las pruebas y deploy/ quedan fuera).
# Denegación por defecto: solo se sirven las rutas y extensiones de la app.
# Instalación: ver docs/DESPLIEGUE.md (certificado, vhost y cabeceras con un
# script de /var/www/.edumind_ops; nada se aplica solo).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name reloj.edumind.es;
    include /etc/nginx/sites-available/cloudflare-origin-guard.inc;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reloj.edumind.es;
    include /etc/nginx/sites-available/cloudflare-origin-guard.inc;

    root /var/www/reloj/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/reloj.edumind.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reloj.edumind.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1k;
    autoindex off;

    # Privacidad: IP anonimizada, como en el resto de sitios
    access_log /var/log/nginx/reloj.edumind.es.access.log privacy_log;
    access_log /var/log/nginx/privacy.sites.log privacy_log;
    error_log /var/log/nginx/reloj.edumind.es.error.log warn;

    include /etc/nginx/sites-available/reloj-security-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/manifest+json image/svg+xml text/css text/javascript text/plain;

    # Solo GET y HEAD: no hay nada que recibir
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz {
        include /etc/nginx/sites-available/reloj-security-headers.inc;
        access_log off;
        default_type text/plain;
        return 200 'reloj ok';
    }

    # Portada (la app usa rutas con #, así que no hay más páginas)
    location = / {
        include /etc/nginx/sites-available/reloj-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /index.html {
        include /etc/nginx/sites-available/reloj-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # El service worker nunca se cachea: así una versión nueva llega a los navegadores
    location = /sw.js {
        include /etc/nginx/sites-available/reloj-security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/sites-available/reloj-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fuentes e iconos: estables, caché larga
    location ~ ^/(fuentes|iconos)/[A-Za-z0-9._-]+\.(woff2|svg|png|txt)$ {
        include /etc/nginx/sites-available/reloj-security-headers.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Código de la app: revalidación (el service worker ya la guarda para usarla sin conexión)
    location ~ ^/(js|css)/[A-Za-z0-9._-]+\.(js|css)$ {
        include /etc/nginx/sites-available/reloj-security-headers.inc;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Todo lo demás no existe
    location / {
        return 404;
    }
}
